workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - keystore_credentials # optional, only needed for signed release builds
      vars:
        PACKAGE_NAME: "com.example.androidremote" # change this to your actual applicationId
      node: default
      java: 17
    scripts:
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
      - name: Build debug APK
        script: |
          cd $CM_BUILD_DIR
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/**/*.apk
      - app/build/outputs/mapping/**/mapping.txt
    publishing:
      email:
        recipients:
          - your-email@example.com # change this
        notify:
          success: true
          failure: true
